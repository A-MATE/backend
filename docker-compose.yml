version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: amate_db_admin
      POSTGRES_PASSWORD: amate_db_password
      POSTGRES_DB: amate_db_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nestjs-backend:
    image: a-mate-dev:v0.1
    env_file:
      - .env.local
    environment:
      DATABASE_HOST: postgres
    depends_on:
      - postgres
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
